# BurstGrid configuration file
# All fields are optional — env vars take precedence where documented.
# Place this file at the project root (or set BURSTGRID_CONFIG to its path).

scheduler:
  maxQueueDepth: 500        # 503 returned above this; GitHub retries for 72 h
  rateLimitMax: 1000        # max webhook requests per window
  rateLimitWindow: "1 minute"

autoscaler:
  enabled: true             # set to false to disable all EC2 auto-scaling
  evaluationIntervalSec: 30 # how often to check queue depth vs. capacity

  fleets:
    # Each fleet maps a job size label to an EC2 launch template + subnet set.
    #
    # launchTemplateId — the ID of the EC2 Launch Template that BurstGrid will use
    #   when launching spot/on-demand instances for this fleet.
    #   Find yours:
    #     AWS Console → EC2 → Launch Templates (copy the "Launch template ID" column)
    #     AWS CLI:  aws ec2 describe-launch-templates \
    #                 --query 'LaunchTemplates[*].[LaunchTemplateId,LaunchTemplateName]' \
    #                 --output table
    #   The template must configure the AMI, instance profile, security groups, and
    #   a user-data script that installs and starts the burstgrid worker-agent.
    #
    # subnetIds — the VPC subnets BurstGrid may launch instances into.
    #   Spread across multiple AZs so spot capacity is available even when one AZ is tight.
    #   Find yours:
    #     AWS Console → VPC → Subnets (copy the "Subnet ID" column)
    #     AWS CLI:  aws ec2 describe-subnets \
    #                 --query 'Subnets[*].[SubnetId,AvailabilityZone,CidrBlock]' \
    #                 --output table
    #   Use private subnets with a NAT gateway (workers only need outbound internet).

    # medium — m6g.large (2 vCPU / 8 GiB) — typecheck jobs
    - name: medium
      sizeTag: "burstgrid:size=medium"
      launchTemplateId: lt-REPLACE_ME
      subnetIds:
        - subnet-2fe9c849
        - subnet-23f58012
        - subnet-7e67485f
        - subnet-350afb79
        - subnet-fcefcda3
      maxWorkers: 5
      slotsPerWorker: 2
      scaleUpThreshold: 1
      capacityType: spot

    # large — m6g.2xlarge (8 vCPU / 32 GiB) — test jobs
    - name: large
      sizeTag: "burstgrid:size=large"
      launchTemplateId: lt-REPLACE_ME
      subnetIds:
        - subnet-2fe9c849
        - subnet-23f58012
        - subnet-7e67485f
        - subnet-350afb79
        - subnet-fcefcda3
      maxWorkers: 10
      slotsPerWorker: 4
      scaleUpThreshold: 2
      capacityType: spot

    # xlarge — m6g.4xlarge (16 vCPU / 64 GiB) — build jobs
    - name: xlarge
      sizeTag: "burstgrid:size=xlarge"
      launchTemplateId: lt-REPLACE_ME
      subnetIds:
        - subnet-2fe9c849
        - subnet-23f58012
      maxWorkers: 5
      slotsPerWorker: 8
      scaleUpThreshold: 1
      capacityType: spot

    # 2xlarge — m6g.4xlarge (16 vCPU / 64 GiB) — stress jobs; spot w/ on-demand fallback
    - name: 2xlarge
      sizeTag: "burstgrid:size=2xlarge"
      launchTemplateId: lt-REPLACE_ME
      instanceType: m6g.4xlarge
      subnetIds:
        - subnet-7e67485f
        - subnet-350afb79
        - subnet-fcefcda3
      maxWorkers: 3
      slotsPerWorker: 2
      scaleUpThreshold: 1
      capacityType: spot

# ── Optional backends ──────────────────────────────────────────────────────────
# All fields are also settable via env vars (env takes precedence).

# ── Worker config ──────────────────────────────────────────────────────────────
# worker:
#   # Pull-through registry mirror — VMs receive this as a REGISTRY_MIRROR boot arg.
#   # The rootfs init must read /proc/cmdline and write /etc/docker/daemon.json.
#   # For AWS: use an ECR pull-through cache endpoint or a registry:2 sidecar.
#   # Env: BURSTGRID_REGISTRY_MIRROR
#   registryMirror: http://10.0.0.1:5000

backends:
  # Redis (ElastiCache) — enables job queue durability and worker registry persistence.
  # If set, the queue survives scheduler restarts and workers are tracked in Redis.
  # Env: BURSTGRID_REDIS_URL
  # redis:
  #   url: redis://your-elasticache.abc123.use1.cache.amazonaws.com:6379

  # SQS — poll a queue for incoming jobs in addition to (or instead of) webhooks.
  # Useful for fan-out architectures where GitHub webhooks land in SQS via Lambda or SNS.
  # Env: BURSTGRID_SQS_QUEUE_URL, BURSTGRID_SQS_REGION
  # sqs:
  #   queueUrl: https://sqs.us-east-1.amazonaws.com/123456789012/burstgrid-jobs
  #   region: us-east-1

  # DynamoDB — append-only job event log (queued, dispatched, completed, failed).
  # Table schema: PK=JOB#<id> (S), SK=<ISO timestamp>#<status> (S)
  # Env: BURSTGRID_DYNAMODB_TABLE, BURSTGRID_DYNAMODB_REGION
  # dynamodb:
  #   tableName: burstgrid-jobs
  #   region: us-east-1
