# Prometheus/Mimir alerting rules for the BurstGrid dashboard. Import this rule
# group into Grafana Alerting (or Prometheus rule_files) and route the alerts to
# the on-call receiver used by your organization.
groups:
  - name: burstgrid-scheduler-health
    rules:
      # The capacity/EC2 alerts below all assume the scheduler process is alive
      # and still pushing metrics. Neither failure mode here is covered by them:
      # a dead process emits nothing at all, so absent_over_time() is the only
      # signal — and a fast crash loop can keep emitting just often enough that
      # absence never trips, which is what burstgrid_scheduler_starts_total catches.
      - alert: BurstGridSchedulerDown
        expr: absent_over_time(burstgrid_queue_depth[5m])
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: No scheduler metrics received in 5 minutes — the process is likely down or disconnected from the OTel pipeline.
      - alert: BurstGridSchedulerCrashLooping
        expr: increase(burstgrid_scheduler_starts_total[10m]) > 3
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: Scheduler has restarted more than 3 times in 10 minutes — likely crash-looping.
  - name: burstgrid-capacity
    rules:
      - alert: BurstGridQueuedJobsTooOld
        expr: burstgrid_queue_oldest_age_seconds > 300
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: BurstGrid has a job queued for more than five minutes.
      - alert: BurstGridNoCapableWorkers
        expr: burstgrid_queue_depth > 0 and burstgrid_workers_free_slots == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: BurstGrid has queued work but no free worker capacity.
      - alert: BurstGridWorkerLaunchFailures
        expr: increase(burstgrid_worker_launch_failures_total[10m]) > 2
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: Worker launches are repeatedly failing.
      - alert: BurstGridEc2ApiThrottling
        expr: increase(burstgrid_worker_launch_failures_total{reason="throttled"}[10m]) > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: EC2 API throttling is preventing BurstGrid scale-up.
      - alert: BurstGridVmBootP95Slow
        expr: histogram_quantile(0.95, sum(rate(burstgrid_vm_boot_duration_ms_bucket[10m])) by (le)) > 1000
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: Firecracker VM boot p95 exceeds one second.
      - alert: BurstGridRunnerSetupFailures
        expr: increase(burstgrid_runner_setup_failures_total[10m]) > 2
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: Runner or VM configuration is failing before jobs start.
      - alert: BurstGridGithubQuotaLow
        expr: (burstgrid_github_rate_limit_remaining / burstgrid_github_rate_limit_limit) < 0.1
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: GitHub API quota for this org is below 10% of its window limit.
      - alert: BurstGridGithubRateLimited
        expr: increase(burstgrid_github_rate_limit_exceeded_total[5m]) > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: GitHub is actively rejecting API calls for exceeding a rate limit — job dispatch is degraded or stalled for this org.
