services:
  scheduler:
    build:
      context: .
      target: scheduler
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      BURSTGRID_WEBHOOK_SECRET: ""
      BURSTGRID_ADDR: "0.0.0.0"
      BURSTGRID_PORT: "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  worker:
    build:
      context: .
      target: worker
    environment:
      BURSTGRID_MODE: simulate
      BURSTGRID_SCHEDULER_URL: http://scheduler:8080
      BURSTGRID_WORKER_ID: local-worker-1
      BURSTGRID_SLOTS: "4"
      BURSTGRID_VCPUS: "8"
      BURSTGRID_MEMORY_MIB: "16384"
      BURSTGRID_CAPABILITIES: linux,x86_64,docker
    depends_on:
      scheduler:
        condition: service_healthy

  # GPU bare-metal worker example — uses 'process' mode, no Firecracker
